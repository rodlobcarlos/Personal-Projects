name: Portfolio Frontend CI/CD

on:
  pull_request:
    paths:
      - "Portfolio/myPortfolioFt/myPortfolioWeb/**"
      - ".github/workflows/portfolio-frontend.yml"
  push:
    branches: [main]
    paths:
      - "Portfolio/myPortfolioFt/myPortfolioWeb/**"
      - ".github/workflows/portfolio-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FRONTEND_DIR: Portfolio/myPortfolioFt/myPortfolioWeb

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint
      - name: Unit tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm test -- --watch=false --coverage
      - name: Production build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --configuration production
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.FRONTEND_DIR }}/dist/myPortfolioWeb

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
