# CI pipeline for backend with test and docker configuration
name: Prosperare CI

# Only run when push or pr in main bracnh
on: 
  push:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"
  pull_request:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"

permissions:
  contents: read
  packages: write
  
jobs:
  # Run backend tests and database service
  test-backend:
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
            
    defaults:
      run:
        working-directory: Prosperare/backend

    steps:
      - name: Download code
        uses: actions/checkout@v4
        
      - name: Install dependences
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
        
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  #Build backend setup
  build-backend:
    needs: test-backend
    runs-on: ubuntu-22.04

    defaults:
        run:
          working-directory: Prosperare/backend
        
    steps:
    - name: Download code
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.x'
        cache: pip
        cache-dependency-path: Prosperare/backend/requirements.txt

    - name: Install dependences
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
          
    - name: Run Ruff
      working-directory: Prosperare/backend
      run: ruff check .

  # Build docker images
  build-docker:
    runs-on: ubuntu-22.04
    needs: build-backend

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Build Docker backend image
        run: docker build -t ghcr.io/rodlobcarlos/prosperare-backend:latest ./Prosperare/backend

      - name: Build Docker frontend image
        run: docker build -t ghcr.io/rodlobcarlos/prosperare-frontend:latest ./Prosperare/frontend
      
