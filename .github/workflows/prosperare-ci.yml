name: Prosperare CI

# Only run when push or pr in main bracnh
on: 
  push:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"
  pull_request:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"

permissions:
  contents: read
  
jobs:
  test-backend:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: Prosperare/backend

    steps:
      - name: Download code
        uses: actions/checkout@v4
        
      - name: Install dependences
        run: |
          pip install --no-cache-dir -r requirements.txt
          python -m pip install --upgrade pip
          pip install pytest
        
      - name: Run tests
        run: pytest


  build-backend:
    needs: test-backend
    runs-on: ubuntu-22.04

    steps:
    - name: Download code
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.x'


  build-docker:
    runs-on: ubuntu-22.04
    needs: build-backend

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t prosperare-backend ./Prosperare/backend

      - name: Construir imagen del frontend
        run: docker build -t prosperare-frontend ./Prosperare/frontend
      
