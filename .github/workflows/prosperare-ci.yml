name: Prosperare CI

# Only run when push or pr in main bracnh
on: 
  push:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"
  pull_request:
    branches: main
    paths:
      - "Prosperare/**"
      - ".github/workflows/prosperare-ci.yml"

permissions:
  contents: read
  
jobs:
  # Run backend tests and database service
  test-backend:
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.PASSWORD }}
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
            
    defaults:
      run:
        working-directory: Prosperare/backend

    steps:
      - name: Download code
        uses: actions/checkout@v4
        
      - name: Install dependences
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
        
      - name: Run tests with coverage
        env:
          MONGODB_URL: mongodb://${{ secrets.USERNAME }}:${{ secrets.PASSWORD }}@localhost:27017/?authSource=admin
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        run: pytest --cov=app --cov-report=term-missing

  #Build backend setup
  build-backend:
    needs: test-backend
    runs-on: ubuntu-22.04

    steps:
    - name: Download code
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.x'
        cache: pip
        cache-dependency-path: Prosperare/backend/requirements.txt

    - name: Run Ruff
      working-directory: Prosperare/backend
      run: ruff check .

  # Build docker images
  build-docker:
    runs-on: ubuntu-22.04
    needs: build-backend

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Build Docker backend image
        run: docker build -t prosperare-backend ./Prosperare/backend

      - name: Build Docker frontend image
        run: docker build -t prosperare-frontend ./Prosperare/frontend
      
