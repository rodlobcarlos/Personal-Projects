<div class="landing-container">
  <!-- Header / Navigation -->
  <header class="header">
    <nav class="navbar">
      <ul class="nav-list">
        <li *ngFor="let item of navItems" class="nav-item">
          <a [href]="item.href" class="nav-link">{{ item.label }}</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="hero-section">
      <h1 class="hero-title">Live&Tasks</h1>
      <p class="hero-subtitle">Organiza tu vida como nunca lo habías hecho, fácil e intuitivo.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer-text">Aplicación creada por Carlos Rodriguez Lobato / 2026</p>
  </footer>
</div>
