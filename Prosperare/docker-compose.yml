# Docker Compose configuration for Prosperare application
services:
  mongodb:
    image: mongo:8
    container_name: prosperare-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: prosperaredb
    volumes:
      - prosperare_mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service
  backend:
    build:
      context: ./backend
    container_name: prosperare-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: prosperaredb
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend service
  frontend:
    build:
      context: ./frontend
    container_name: prosperare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  prosperare_mongo_data:
