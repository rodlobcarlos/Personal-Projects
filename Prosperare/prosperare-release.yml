
name: Prosperare Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/prosperare-backend:${{ steps.version.outputs.tag }} \
            ./Prosperare/backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/prosperare-frontend:${{ steps.version.outputs.tag }} \
            ./Prosperare/frontend

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/prosperare-backend:${{ steps.version.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/prosperare-frontend:${{ steps.version.outputs.tag }}
