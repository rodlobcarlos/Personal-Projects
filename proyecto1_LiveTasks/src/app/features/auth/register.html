<div class="auth-page">
  <div class="auth-card">
    <a class="auth-back" routerLink="/">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      {{ 'common.back' | translate }}
    </a>

    <h1 class="auth-card__title">{{ 'auth.registerTitle' | translate }}</h1>
    <p class="auth-card__subtitle">{{ 'auth.registerSubtitle' | translate }}</p>

    @if (errorKey()) {
      <div class="auth-error" role="alert">{{ errorKey() | translate }}</div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="field">
        <span class="field__label">{{ 'auth.name' | translate }}</span>
        <input
          class="field__input"
          type="text"
          formControlName="name"
          autocomplete="name"
          [attr.aria-invalid]="hasError('name', 'required')"
        />
        @if (hasError('name', 'required')) {
          <span class="field__error">{{ 'auth.requiredField' | translate }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ 'auth.email' | translate }}</span>
        <input
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          [attr.aria-invalid]="hasError('email', 'required') || hasError('email', 'email')"
        />
        @if (hasError('email', 'required')) {
          <span class="field__error">{{ 'auth.requiredField' | translate }}</span>
        } @else if (hasError('email', 'email')) {
          <span class="field__error">{{ 'auth.invalidEmail' | translate }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ 'auth.password' | translate }}</span>
        <input
          class="field__input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="hasError('password', 'required') || hasError('password', 'minlength')"
        />
        @if (hasError('password', 'required')) {
          <span class="field__error">{{ 'auth.requiredField' | translate }}</span>
        } @else if (hasError('password', 'minlength')) {
          <span class="field__error">{{ 'auth.weakPassword' | translate }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ 'auth.confirmPassword' | translate }}</span>
        <input
          class="field__input"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [attr.aria-invalid]="hasError('confirmPassword', 'required') || hasMismatch()"
        />
        @if (hasError('confirmPassword', 'required')) {
          <span class="field__error">{{ 'auth.requiredField' | translate }}</span>
        } @else if (hasMismatch()) {
          <span class="field__error">{{ 'auth.passwordMismatch' | translate }}</span>
        }
      </label>

      <button class="button button--primary button--block" type="submit" [disabled]="loading()">
        {{ loading() ? ('auth.registering' | translate) : ('auth.registerCta' | translate) }}
      </button>
    </form>

    <div class="auth-divider"><span>{{ 'landing.or' | translate }}</span></div>

    <button
      class="button button--google button--block"
      type="button"
      (click)="signInWithGoogle()"
      [disabled]="loading()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81Z"
        />
        <path
          fill="#34A853"
          d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24Z"
        />
        <path
          fill="#FBBC05"
          d="M5.29 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.4-2.29v-3.1H1.28a12 12 0 0 0 0 10.78l4.01-3.1Z"
        />
        <path
          fill="#EA4335"
          d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44A11.98 11.98 0 0 0 12 0 12 12 0 0 0 1.28 6.6l4.01 3.1C6.23 6.86 8.88 4.75 12 4.75Z"
        />
      </svg>
      {{ 'landing.continueWithGoogle' | translate }}
    </button>

    <p class="auth-switch">
      {{ 'auth.haveAccount' | translate }}
      <a class="auth-switch__link" routerLink="/auth/login">{{ 'auth.loginCta' | translate }}</a>
    </p>
  </div>
</div>
