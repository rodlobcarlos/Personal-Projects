services:
  postgres:
    image: postgres:17-alpine
    container_name: miapp-postgres
    environment:
      POSTGRES_DB: miapp
      POSTGRES_USER: miapp
      POSTGRES_PASSWORD: miapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miapp -d miapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
