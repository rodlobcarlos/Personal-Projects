<div class="task-item" [class.completed]="task().completed">
  <button
    class="check"
    [class.checked]="task().completed"
    [attr.aria-label]="task().completed ? 'Marcar como pendiente' : 'Marcar como completada'"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (editing) {
    <input
      class="edit-input"
      #editInput
      [value]="editValue"
      (input)="editValue = $any($event.target).value"
      (blur)="saveEdit()"
      (keydown)="onKeydown($event)"
      autofocus
    />
  } @else {
    <span class="title" (dblclick)="startEdit()">{{ task().title }}</span>
  }

  <div class="actions">
    <button class="btn-icon edit" aria-label="Editar tarea" title="Editar" (click)="startEdit()">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="btn-icon delete" aria-label="Eliminar tarea" title="Eliminar" (click)="delete()">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M3 6h18M8 6V4h8v2m1 0l-1 14H8L7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</div>
